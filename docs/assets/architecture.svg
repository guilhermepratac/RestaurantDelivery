<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
<title id="title">Um contrato, duas origens</title>
<desc id="desc">RemoteRestaurantLoader e LocalRestaurantLoader implementam RestaurantLoader. O remoto usa NetworkClient e URLSession; o local usa CacheClient e CachePolicy.</desc>
